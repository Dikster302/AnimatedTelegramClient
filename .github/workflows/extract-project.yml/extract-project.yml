
name: Extract Android project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          archive="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$archive" ]; then
            echo "ZIP archive not found"
            exit 1
          fi

          unzip -o "$archive" -d .
          rm "$archive"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes"
          else
            git commit -m "Extract Android project scaffold"
            git push
          fi
