name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build gperf php-cli perl python3 git wget unzip zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Checkout pinned TDLib source
        run: |
          git clone https://github.com/tdlib/td.git tdlib-src
          cd tdlib-src
          git checkout c8828d50f5eac2fc7089ce1089d7ce9095c61b5e
      - name: Build official TDLib JNI
        working-directory: tdlib-src/example/android
        run: |
          chmod +x check-environment.sh fetch-sdk.sh build-openssl.sh build-tdlib.sh
          ./check-environment.sh
          ./fetch-sdk.sh SDK 23.2.8568313
          ./build-openssl.sh SDK 23.2.8568313 third-party/openssl
          ./build-tdlib.sh SDK 23.2.8568313 third-party/openssl c++_static Java 21 arm64-v8a
      - name: Copy generated TDLib files
        run: |
          mkdir -p AnimatedTelegramClient/app/src/main/java/org/drinkless/tdlib AnimatedTelegramClient/app/src/main/jniLibs/arm64-v8a
          cp tdlib-src/example/android/tdlib/java/org/drinkless/tdlib/Client.java AnimatedTelegramClient/app/src/main/java/org/drinkless/tdlib/
          cp tdlib-src/example/android/tdlib/java/org/drinkless/tdlib/TdApi.java AnimatedTelegramClient/app/src/main/java/org/drinkless/tdlib/
          cp tdlib-src/example/android/tdlib/libs/arm64-v8a/libtdjni.so AnimatedTelegramClient/app/src/main/jniLibs/arm64-v8a/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Prepare persistent release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/specialgram-release.jks"
          test -s "$RUNNER_TEMP/specialgram-release.jks"
      - name: Build signed update APK
        working-directory: AnimatedTelegramClient
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/specialgram-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Specialgram-update
          path: AnimatedTelegramClient/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
