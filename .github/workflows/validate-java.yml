name: Validate Android Java and Kotlin
on:
  push:
    branches:
      - migration/android-java-native
      - "feature/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android compile SDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Checkout pinned TDLib source
        run: |
          git clone https://github.com/tdlib/td.git tdlib-src
          cd tdlib-src
          git checkout c8828d50f5eac2fc7089ce1089d7ce9095c61b5e
      - name: Generate TDLib Java API sources
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gperf php-cli
          cd tdlib-src/example/android
          mkdir -p build-native-Java
          cd build-native-Java
          cmake -DTD_GENERATE_SOURCE_FILES=ON ..
          cmake --build . --target tl_generate_java
          cd ..
          php AddIntDef.php org/drinkless/tdlib/TdApi.java
          mkdir -p tdlib/java/org/drinkless/tdlib
          cp ../java/org/drinkless/tdlib/Client.java tdlib/java/org/drinkless/tdlib/
          mv org/drinkless/tdlib/TdApi.java tdlib/java/org/drinkless/tdlib/
          mkdir -p ../../../AnimatedTelegramClient/app/src/main/java/org/drinkless/tdlib
          cp tdlib/java/org/drinkless/tdlib/Client.java ../../../AnimatedTelegramClient/app/src/main/java/org/drinkless/tdlib/
          cp tdlib/java/org/drinkless/tdlib/TdApi.java ../../../AnimatedTelegramClient/app/src/main/java/org/drinkless/tdlib/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compile Kotlin and Java without packaging an APK
        working-directory: AnimatedTelegramClient
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: gradle --no-daemon compileDebugKotlin compileDebugJavaWithJavac
